<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; height: 0; overflow: hidden; }</style>
</head>
<body>
<script>
/* 브라우저 위치(위도·경도)를 한 번 물어서 Streamlit 에 돌려준다. 화면에는 아무것도 그리지 않는다.
   돌려주는 값: {lat, lng} (소수 셋째 자리까지만 — 동네를 고를 만큼만) 또는 {error: "denied" | "unavailable" | "timeout" | "unsupported"} */
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
const value = (v) => send("streamlit:setComponentValue", { value: v, dataType: "json" });
send("streamlit:componentReady", { apiVersion: 1 });
send("streamlit:setFrameHeight", { height: 0 });

let asked = false;
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render" || asked) return;
  asked = true;
  // iframe 에서 막히면 같은 주소인 바깥 페이지의 navigator 로 한 번 더 시도한다
  const geo = navigator.geolocation || (window.parent && window.parent.navigator && window.parent.navigator.geolocation);
  if (!geo) { value({ error: "unsupported" }); return; }
  const round = (x) => Math.round(x * 1000) / 1000;
  geo.getCurrentPosition(
    (pos) => value({ lat: round(pos.coords.latitude), lng: round(pos.coords.longitude) }),
    (err) => value({ error: err.code === 1 ? "denied" : err.code === 3 ? "timeout" : "unavailable" }),
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 10 * 60 * 1000 },
  );
});
</script>
</body>
</html>
