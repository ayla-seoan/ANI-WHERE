<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #ffffff;
    --grid: #e8e8ed;
    --cell: #f3f1fd;
    --cell-over: #e2ddfb;
    --text: #1c1c1e;
    --muted: #6b6b76;
  }
  * { box-sizing: border-box; }
  html, body { height: auto; }
  body {
    margin: 0; padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--text); background: var(--bg);
  }
  .wrap { display: block; }
  .axis-top {
    font-size: 12px; font-weight: 700; color: var(--muted);
    margin: 0 0 8px 2px;
  }
  .y-axis {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .y-axis .label {
    writing-mode: vertical-rl; transform: rotate(180deg);
    letter-spacing: .03em; white-space: nowrap;
  }
  .board { display: grid; gap: 8px; }
  .row-head {
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-align: center; word-break: keep-all; line-height: 1.2;
    padding-top: 22px;
  }
  .cell {
    background: var(--cell); border: 1.5px solid transparent; border-radius: 10px;
    min-height: 130px; padding: 8px; transition: background .12s, border-color .12s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .cell.over { background: var(--cell-over); border-color: #8b7ef0; }
  .cell-note {
    font-size: 10px; font-weight: 700; color: #6c5ce7;
    letter-spacing: .02em; text-transform: uppercase;
  }
  .cell-note .rank { opacity: .55; font-weight: 600; }
  .sticker {
    border-radius: 6px; padding: 7px 8px; cursor: grab;
    box-shadow: 0 1px 3px rgba(0,0,0,.14);
    font-size: 12px; line-height: 1.35; user-select: none;
    border: 1px solid rgba(0,0,0,.06);
  }
  .sticker:active { cursor: grabbing; }
  .sticker.dragging { opacity: .4; }
  .sticker .title { font-weight: 600; display: block; margin-bottom: 3px; }
  .sticker .meta { font-size: 10px; color: rgba(0,0,0,.55); }
  .col-heads { display: grid; gap: 8px; margin-top: 6px; }
  .col-head { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); }
  .x-axis { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 6px; }
  .hint { font-size: 11px; color: var(--muted); margin: 0 0 10px 2px; }
  .empty { font-size: 11px; color: #a0a0aa; text-align: center; padding: 18px 0; }
</style>
</head>
<body>
<p class="hint">스티커를 끌어서 다른 칸으로 옮기거나 칸 안에서 위아래로 바꾸면 순위가 다시 계산됩니다.</p>
<div id="root"></div>

<script>
/* ---------- Streamlit 연결 (빌드 없이 쓰는 기본 핸드셰이크) ---------- */
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
const Streamlit = {
  ready: () => send("streamlit:componentReady", { apiVersion: 1 }),
  height: (h) => send("streamlit:setFrameHeight", { height: h }),
  value: (v) => send("streamlit:setComponentValue", { value: v, dataType: "json" }),
};

/* ---------- 상태 ---------- */
let TEMPLATE = null;      // {rows, cols, order, cell_notes, x_axis, y_axis}
let STICKERS = {};        // id -> sticker
let LAYOUT = {};          // cellKey -> [id]
let PALETTE = {};         // kpi -> 색

const COLORS = ["#FDE68A", "#A5C8F5", "#BBF7D0", "#FBCFE8", "#FDBA8C", "#C7D2FE", "#D9D4F7"];

function colorFor(kpi) {
  if (kpi === "(제외)") return "#E5E7EB";
  if (!(kpi in PALETTE)) PALETTE[kpi] = COLORS[Object.keys(PALETTE).length % COLORS.length];
  return PALETTE[kpi];
}

/* ---------- 렌더 ---------- */
function render() {
  const root = document.getElementById("root");
  const rows = TEMPLATE.rows, cols = TEMPLATE.cols;
  const colTemplate = `repeat(${cols.length}, minmax(0, 1fr))`;

  root.innerHTML = "";

  const wrap = document.createElement("div");
  wrap.className = "wrap";

  const yAxis = document.createElement("div");
  yAxis.className = "axis-top";
  yAxis.textContent = "↑ 위로 갈수록 " + TEMPLATE.y_axis + " 큼";
  wrap.appendChild(yAxis);

  const right = document.createElement("div");

  const board = document.createElement("div");
  board.className = "board";
  board.style.gridTemplateColumns = `56px ${colTemplate}`;

  rows.forEach(([rowKey, rowLabel]) => {
    const head = document.createElement("div");
    head.className = "row-head";
    head.textContent = rowLabel;
    board.appendChild(head);

    cols.forEach(([colKey]) => {
      const key = `${rowKey}-${colKey}`;
      board.appendChild(buildCell(key));
    });
  });

  right.appendChild(board);

  const colHeads = document.createElement("div");
  colHeads.className = "col-heads";
  colHeads.style.gridTemplateColumns = `56px ${colTemplate}`;
  colHeads.appendChild(document.createElement("div"));
  cols.forEach(([, colLabel]) => {
    const h = document.createElement("div");
    h.className = "col-head";
    h.textContent = colLabel;
    colHeads.appendChild(h);
  });
  right.appendChild(colHeads);

  const xAxis = document.createElement("div");
  xAxis.className = "x-axis";
  xAxis.textContent = "오른쪽으로 갈수록 " + TEMPLATE.x_axis + " 큼 →";
  right.appendChild(xAxis);

  wrap.appendChild(right);
  root.appendChild(wrap);

  syncHeight();
  setTimeout(syncHeight, 150);
}

let lastHeight = 0;
function syncHeight() {
  // document.scrollHeight 를 쓰면 안 된다. iframe 이 커지면 body 도 따라 커져서
  // 높이가 무한히 불어난다. 내용물 블록의 실제 높이만 잰다.
  const hint = document.querySelector(".hint");
  const root = document.getElementById("root");
  if (!root) return;
  const h = (hint ? hint.offsetHeight + 10 : 0) + root.offsetHeight + 28;
  if (Math.abs(h - lastHeight) < 8) return;
  lastHeight = h;
  Streamlit.height(h);
}

function buildCell(key) {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.dataset.cell = key;

  const note = document.createElement("div");
  note.className = "cell-note";
  const rank = TEMPLATE.order[key];
  note.innerHTML = `${TEMPLATE.cell_notes[key] || ""} <span class="rank">${rank}순위 칸</span>`;
  cell.appendChild(note);

  const ids = LAYOUT[key] || [];
  if (ids.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "비어 있음";
    cell.appendChild(empty);
  }
  ids.forEach((id) => {
    const s = STICKERS[id];
    if (s) cell.appendChild(buildSticker(s));
  });

  cell.addEventListener("dragover", (e) => {
    e.preventDefault();
    cell.classList.add("over");
  });
  cell.addEventListener("dragleave", () => cell.classList.remove("over"));
  cell.addEventListener("drop", (e) => {
    e.preventDefault();
    cell.classList.remove("over");
    const id = e.dataTransfer.getData("text/plain");
    if (!id) return;
    const target = e.target.closest(".sticker");
    moveSticker(id, key, target ? target.dataset.id : null);
  });

  return cell;
}

function buildSticker(s) {
  const el = document.createElement("div");
  el.className = "sticker";
  el.draggable = true;
  el.dataset.id = s.id;
  el.style.background = colorFor(s.kpi);
  el.innerHTML =
    `<span class="title">${escapeHtml(s.title)}</span>` +
    `<span class="meta">${escapeHtml(s.kpi)} · ${s.effort_days}일 · AI ${s.ai_rank}위</span>`;
  el.title = s.reason || "";

  el.addEventListener("dragstart", (e) => {
    e.dataTransfer.setData("text/plain", s.id);
    e.dataTransfer.effectAllowed = "move";
    el.classList.add("dragging");
  });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));
  return el;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- 이동 ---------- */
function moveSticker(id, toCell, beforeId) {
  for (const key of Object.keys(LAYOUT)) {
    LAYOUT[key] = LAYOUT[key].filter((x) => x !== id);
  }
  if (!LAYOUT[toCell]) LAYOUT[toCell] = [];

  if (beforeId && beforeId !== id) {
    const at = LAYOUT[toCell].indexOf(beforeId);
    LAYOUT[toCell].splice(at < 0 ? LAYOUT[toCell].length : at, 0, id);
  } else {
    LAYOUT[toCell].push(id);
  }
  render();
  Streamlit.value({ layout: LAYOUT, at: Date.now() });
}

/* ---------- Streamlit 에서 데이터 받기 ---------- */
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  if (!args.template) return;

  TEMPLATE = args.template;
  STICKERS = {};
  (args.stickers || []).forEach((s) => { STICKERS[s.id] = s; });

  // 사용자가 이미 옮긴 배치가 있으면 그것을 쓴다.
  LAYOUT = JSON.parse(JSON.stringify(args.layout || {}));
  for (const key of Object.keys(TEMPLATE.order)) {
    if (!LAYOUT[key]) LAYOUT[key] = [];
  }
  render();
});

Streamlit.ready();
Streamlit.height(400);
</script>
</body>
</html>
