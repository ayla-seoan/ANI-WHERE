<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; height: 0; overflow: hidden; }</style>
</head>
<body>
<script>
/* 브라우저에 있는 로그인 쿠키(이름 = args.name)를 읽어 Streamlit 서버로 넘긴다. 화면에는 아무것도 그리지 않는다.
   배포(Streamlit Community Cloud)에서는 앞단을 거치며 앱 서버가 이 쿠키를 받지 못해(st.context.cookies 에 없음)
   새로고침하면 로그인이 풀렸다 (11/18). 값이 있을 때만, 바뀌었을 때만 보낸다 (손님은 다시 그리기를 일으키지 않게) */
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
send("streamlit:componentReady", { apiVersion: 1 });
send("streamlit:setFrameHeight", { height: 0 });

let last = null, name = "";
function check() {
  if (!name) return;
  let v = "";
  try {
    const m = window.parent.document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
    v = m ? decodeURIComponent(m[1]) : "";
  } catch (e) { v = ""; }
  if (v && v !== last) {
    last = v;
    send("streamlit:setComponentValue", { value: v, dataType: "json" });
  }
}
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  name = String((event.data.args || {}).name || "");
  check();
});
// 간편 로그인 작은 창에서 로그인이 끝나면(신호 aw_login_done) 바로 쿠키를 다시 읽어 넘긴다 →
// 원래 창은 페이지를 통째로 새로고침하지 않고 화면만 다시 그려 로그인된다 (11/18 요청: 간편 로그인이 너무 오래 걸림).
// 신호를 못 받는 브라우저를 위해 1초마다도 확인한다 (손님일 때만 이 부품이 있다)
window.addEventListener("storage", (e) => { if (e.key === "aw_login_done") check(); });
setInterval(check, 1000);
</script>
</body>
</html>
