<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                      "Malgun Gothic", "Noto Sans KR", sans-serif; }
  button {
    width: 100%; height: 38px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(49, 51, 63, .2); background: #fff; color: #31333f;
    font-size: 14px; font-family: inherit;
  }
  button:hover { border-color: #56C2A7; color: #2E9C82; }
  #box { display: none; margin-top: 6px; height: 430px; border: 1px solid #e3e4e8;
         border-radius: 8px; overflow: hidden; }
  .msg { padding: 8px 2px; font-size: 12px; color: #6b6b76; }
</style>
</head>
<body>
<button id="open">📮 우편번호로 주소 찾기</button>
<div id="box"></div>

<script>
/* ---------- Streamlit 연결 (빌드 없이 쓰는 기본 핸드셰이크) ---------- */
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
const Streamlit = {
  ready: () => send("streamlit:componentReady", { apiVersion: 1 }),
  height: (h) => send("streamlit:setFrameHeight", { height: h }),
  value: (v) => send("streamlit:setComponentValue", { value: v, dataType: "json" }),
};

const CLOSED = 44, OPENED = 44 + 442;
const box = document.getElementById("box");
const btn = document.getElementById("open");
let sdk = null;

function loadSdk() {
  return sdk || (sdk = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js";
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  }));
}

function close() {
  box.style.display = "none";
  box.innerHTML = "";
  btn.textContent = "📮 우편번호로 주소 찾기";
  Streamlit.height(CLOSED);
}

btn.onclick = () => {
  if (box.style.display === "block") { close(); return; }
  box.style.display = "block";
  btn.textContent = "닫기";
  Streamlit.height(OPENED);
  // 팝업 창은 브라우저가 막을 수 있어 화면 안에 펼친다
  loadSdk().then(() => {
    new kakao.Postcode({
      width: "100%", height: "100%",
      oncomplete: (data) => {
        Streamlit.value({
          address: data.roadAddress || data.jibunAddress || data.address,
          jibun: data.jibunAddress || data.autoJibunAddress || "",
          building: data.buildingName || "",
          zonecode: data.zonecode,
          at: Date.now(),
        });
        close();
      },
    }).embed(box);
  }, () => {
    box.innerHTML = '<div class="msg">카카오 우편번호 서비스를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.</div>';
  });
};

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
});

Streamlit.ready();
Streamlit.height(CLOSED);
</script>
</body>
</html>
