<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  /* A안 상세 (11/25, 웹 a-detail.css 의 .ad-gal 과 같게): 3:4 큰 사진(민트 테두리) + 양옆 ‹ › + 아래 작은 사진 줄 */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                      "Malgun Gothic", "Noto Sans KR", sans-serif; }
  #gal { display: flex; flex-direction: column; gap: 10px; }
  .stage { position: relative; aspect-ratio: 3 / 4; border-radius: 18px; overflow: hidden;
           border: 2.5px solid #9EDDCC; background: #f4f6f5; }
  .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           cursor: zoom-in; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
  .slide.on { opacity: 1; pointer-events: auto; }
  .slide img { width: 100%; height: 100%; object-fit: contain; user-select: none; display: block; }
  .nav { position: absolute; top: 50%; width: 40px; height: 40px; margin-top: -20px;
         border-radius: 50%; border: 0; background: rgba(255,255,255,.85); color: #26302D;
         font-size: 22px; line-height: 1; padding: 0 0 3px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .nav:hover { background: #fff; }
  .prev { left: 10px; } .next { right: 10px; }
  .count, .zoomhint { position: absolute; top: 10px; display: inline-flex; align-items: center; gap: 4px;
           padding: 3px 10px; border-radius: 999px; background: rgba(31,42,39,.62); color: #fff;
           font-size: 12px; font-weight: 700; pointer-events: none; }
  .count { right: 10px; } .zoomhint { left: 10px; }
  .thumbs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 1px; }
  .thumbs::-webkit-scrollbar { display: none; }
  .thumbs button { flex: 0 0 calc((100% - 24px) / 4); aspect-ratio: 1; border-radius: 10px; border: 2px solid transparent;
           padding: 0; background: #f4f6f5; overflow: hidden; cursor: pointer; }
  .thumbs button.on { border-color: #14b8a6; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (prefers-reduced-motion: reduce) { .slide { transition: none; } }
</style>
</head>
<body>
<div id="gal"><div class="stage" id="stage"></div><div class="thumbs" id="thumbs" hidden></div></div>

<script>
/* ---------- Streamlit 연결 (빌드 없이 쓰는 기본 핸드셰이크) ---------- */
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
const Streamlit = {
  ready: () => send("streamlit:componentReady", { apiVersion: 1 }),
  height: (h) => send("streamlit:setFrameHeight", { height: h }),
};

const AUTO_MS = 4000;      // 이 시간마다 다음 이미지로 넘어간다
let urls = [], idx = 0, timer = null, sig = "";

// 앱이 넘겨주는 주소는 페이지 기준 상대 주소라, 바깥 페이지 주소를 기준으로 바꾼다
const abs = (u) => new URL(u, window.parent.location.href).href;

function go(i) {
  idx = (i + urls.length) % urls.length;
  document.querySelectorAll(".slide").forEach((d, j) => d.classList.toggle("on", j === idx));
  const row = document.getElementById("thumbs");
  row.querySelectorAll("button").forEach((d, j) => d.classList.toggle("on", j === idx));
  const c = document.querySelector(".count");
  if (c) c.textContent = `${idx + 1} / ${urls.length}`;
  // 지금 사진의 작은 그림이 줄 안에 보이게 (줄만 옆으로 민다)
  const cur = row.children[idx];
  if (cur) {
    const left = cur.offsetLeft - row.offsetLeft;
    if (left < row.scrollLeft || left + cur.offsetWidth > row.scrollLeft + row.clientWidth)
      row.scrollTo({ left: Math.max(0, left - cur.offsetWidth), behavior: "smooth" });
  }
}

const still = () => { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
function play() {
  stop();
  if (urls.length > 1 && !still()) timer = setInterval(() => go(idx + 1), AUTO_MS);
}
function stop() { if (timer) { clearInterval(timer); timer = null; } }

// 사진이 안 열리면 깨진 그림 대신 기본 포스터
const FALLBACK = "app/static/default_poster.png";
function fallback(img) {
  img.addEventListener("error", () => { if (!img.dataset.fb) { img.dataset.fb = "1"; img.src = abs(FALLBACK); } });
}

function render() {
  const stage = document.getElementById("stage"), row = document.getElementById("thumbs");
  const many = urls.length > 1;
  stage.innerHTML =
    urls.map((u) => `<div class="slide"><img src="${abs(u)}" alt=""/></div>`).join("") +
    `<span class="zoomhint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>눌러서 크게 보기</span>` +
    (many ? `<span class="count"></span>
             <button class="nav prev" aria-label="이전 사진">‹</button>
             <button class="nav next" aria-label="다음 사진">›</button>` : "");
  row.hidden = !many;
  row.innerHTML = many ? urls.map((u, j) => `<button type="button" aria-label="사진 ${j + 1}"><img src="${abs(u)}" alt="" loading="lazy"/></button>`).join("") : "";
  document.querySelectorAll("#gal img").forEach(fallback);
  stage.querySelectorAll(".slide").forEach((s, j) => s.onclick = () => openZoom(j));
  if (many) {
    stage.querySelector(".prev").onclick = (e) => { e.stopPropagation(); go(idx - 1); play(); };
    stage.querySelector(".next").onclick = (e) => { e.stopPropagation(); go(idx + 1); play(); };
    row.querySelectorAll("button").forEach((d, j) => d.onclick = () => { go(j); play(); });
    const gal = document.getElementById("gal");
    gal.onmouseenter = stop;          // 보고 있는 동안은 멈춘다
    gal.onmouseleave = play;
  }
  go(0);
  play();
  fit();
}

/* 칸 높이 = 내용 높이 (3:4 사진 + 작은 사진 줄). 폭이 바뀌면 다시 맞춘다.
   수정하기 탭에서는 이 칸이 숨겨져 폭이 0 이 되는데, 그때는 높이를 그대로 둔다 */
function fit() {
  const gal = document.getElementById("gal");
  if (!gal.clientWidth) return;
  Streamlit.height(Math.ceil(gal.getBoundingClientRect().height) + 1);
}
window.addEventListener("resize", fit);
try { new ResizeObserver(fit).observe(document.getElementById("gal")); } catch (e) {}

/* ---------- 확대 보기: 바깥 페이지 전체를 덮는 창을 띄운다 ---------- */
function openZoom(start) {
  stop();
  const doc = window.parent.document;
  doc.getElementById("aniwhere-zoom")?.remove();
  let i = start, scale = 1;
  const box = doc.createElement("div");
  box.id = "aniwhere-zoom";
  box.innerHTML = `
    <style>
      #aniwhere-zoom { position: fixed; inset: 0; z-index: 999999; background: rgba(20,28,26,.92);
        display: flex; align-items: center; justify-content: center; }
      #aniwhere-zoom .z-img { max-width: 92vw; max-height: 88vh; object-fit: contain; cursor: zoom-in;
        transition: transform .2s ease; border-radius: 8px; user-select: none; }
      #aniwhere-zoom .z-img.big { cursor: zoom-out; }
      #aniwhere-zoom button { position: absolute; border: 0; cursor: pointer; border-radius: 50%;
        width: 46px; height: 46px; background: rgba(255,255,255,.95); color: #2E9C82; font-size: 24px;
        box-shadow: 0 2px 10px rgba(0,0,0,.3); }
      #aniwhere-zoom button:hover { background: #56C2A7; color: #fff; }
      #aniwhere-zoom .z-close { top: 18px; right: 18px; }
      #aniwhere-zoom .z-prev { left: 18px; top: 50%; transform: translateY(-50%); }
      #aniwhere-zoom .z-next { right: 18px; top: 50%; transform: translateY(-50%); }
      #aniwhere-zoom .z-count { position: absolute; bottom: 20px; color: #fff; font-size: 14px;
        background: rgba(0,0,0,.4); padding: 4px 12px; border-radius: 999px; }
    </style>
    <img class="z-img" alt=""/>
    <button class="z-close" aria-label="닫기">×</button>
    ${urls.length > 1 ? '<button class="z-prev" aria-label="이전">‹</button><button class="z-next" aria-label="다음">›</button>' : ""}
    <span class="z-count"></span>`;
  doc.body.appendChild(box);
  const img = box.querySelector(".z-img");

  const show = (n) => {
    i = (n + urls.length) % urls.length; scale = 1;
    img.style.transform = ""; img.classList.remove("big");
    img.src = abs(urls[i]);
    box.querySelector(".z-count").textContent = `${i + 1} / ${urls.length}  ·  이미지를 누르면 더 크게`;
  };
  const close = () => { box.remove(); doc.removeEventListener("keydown", onKey); go(i); play(); };
  const onKey = (e) => {
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(i - 1);
    if (e.key === "ArrowRight") show(i + 1);
  };

  // 이미지를 누르면 누른 자리를 중심으로 2.2배 확대, 다시 누르면 원래대로
  img.onclick = (e) => {
    e.stopPropagation();
    if (scale === 1) {
      const r = img.getBoundingClientRect();
      img.style.transformOrigin = `${((e.clientX - r.left) / r.width) * 100}% ${((e.clientY - r.top) / r.height) * 100}%`;
      scale = 2.2;
    } else scale = 1;
    img.style.transform = scale === 1 ? "" : `scale(${scale})`;
    img.classList.toggle("big", scale !== 1);
  };
  box.onclick = (e) => { if (e.target === box) close(); };
  box.querySelector(".z-close").onclick = close;
  box.querySelector(".z-prev")?.addEventListener("click", (e) => { e.stopPropagation(); show(i - 1); });
  box.querySelector(".z-next")?.addEventListener("click", (e) => { e.stopPropagation(); show(i + 1); });
  doc.addEventListener("keydown", onKey);
  show(start);
}

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  const next = JSON.stringify(args.urls || []);
  if (next === sig) { fit(); return; }          // 같은 이미지면 다시 그리지 않는다 (보던 위치 유지)
  sig = next;
  urls = args.urls || [];
  render();
});

Streamlit.ready();
Streamlit.height(560);
</script>
</body>
</html>
