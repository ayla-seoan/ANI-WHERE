<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                      "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: center; }  /* 가운데 정렬 */
  button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: #f1f3f2; cursor: pointer;
           display: inline-flex; align-items: center; justify-content: center; padding: 0;
           transition: background .15s, transform .12s; }
  button:hover { background: #e6f6f0; transform: translateY(-1px); }
  button svg { width: 20px; height: 20px; }
  .main.open { background: #e6f6f0; }
  #panel { display: none; gap: 8px; }
  #panel.open { display: flex; }
  .msg { font-size: 12.5px; color: #2E9C82; min-height: 18px; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
<div class="row">
  <button class="main" id="main" title="공유하기" aria-label="공유하기">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2E9C82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
  </button>
  <div id="panel">
    <button id="kakao" title="카카오톡으로 공유" aria-label="카카오톡으로 공유">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#FEE500"/>
        <path d="M12 6.5c-3.6 0-6.5 2.2-6.5 5 0 1.8 1.2 3.4 3 4.3l-.7 2.6 3-2c.4.1.8.1 1.2.1 3.6 0 6.5-2.2 6.5-5s-2.9-5-6.5-5z" fill="#3C1E1E"/></svg>
    </button>
    <button id="insta" title="인스타그램으로 공유" aria-label="인스타그램으로 공유">
      <svg viewBox="0 0 24 24"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#f9ce34"/><stop offset=".5" stop-color="#ee2a7b"/><stop offset="1" stop-color="#6228d7"/></linearGradient></defs>
        <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="url(#ig)" stroke-width="2.2"/>
        <circle cx="12" cy="12" r="4" fill="none" stroke="url(#ig)" stroke-width="2.2"/><circle cx="17.3" cy="6.7" r="1.3" fill="#ee2a7b"/></svg>
    </button>
    <button id="copy" title="링크 복사" aria-label="링크 복사">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2E9C82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
    </button>
  </div>
</div>
<div class="msg" id="msg"></div>

<script>
/* ---------- Streamlit 연결 (빌드 없이 쓰는 기본 핸드셰이크) ---------- */
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
send("streamlit:componentReady", { apiVersion: 1 });
// 처음에는 공유 아이콘만, 누르면 옆에 카카오톡·인스타그램·링크 복사 아이콘이 펼쳐진다
send("streamlit:setFrameHeight", { height: 70 });
document.getElementById("main").onclick = () => {
  const panel = document.getElementById("panel");
  const open = !panel.classList.contains("open");
  panel.classList.toggle("open", open);
  document.getElementById("main").classList.toggle("open", open);
  if (!open) say("");
};

let A = {};                // {cafe_id, title, text, image, kakao_key}
const P = window.parent;   // 같은 주소에서 열려서 바깥 페이지의 공유·복사 기능을 쓸 수 있다

// 이 카페 상세가 바로 열리는 주소 (?cafe=...)
function link() {
  const u = new URL(P.location.href);
  u.search = "?cafe=" + encodeURIComponent(A.cafe_id);
  u.hash = "";
  return u.href;
}
function say(t) { document.getElementById("msg").textContent = t; }

async function copy(okText) {
  const url = link();
  try { await P.navigator.clipboard.writeText(url); }
  catch (e) {
    // 권한이 없으면 옛 방식으로 복사
    const d = P.document, ta = d.createElement("textarea");
    ta.value = url; d.body.appendChild(ta); ta.select(); d.execCommand("copy"); ta.remove();
  }
  say(okText);
}

let kakaoReady = null;
function loadKakao() {
  return kakaoReady || (kakaoReady = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js";
    s.onload = () => { try { if (!Kakao.isInitialized()) Kakao.init(A.kakao_key); resolve(); } catch (e) { reject(e); } };
    s.onerror = reject;
    document.head.appendChild(s);
  }));
}

// 휴대폰인지 (앱을 열 수 있는지)
const MOBILE = /Android|iPhone|iPad|iPod/i.test(P.navigator.userAgent);
const ANDROID = /Android/i.test(P.navigator.userAgent);

// 앱 열기: 휴대폰은 앱 주소(스킴)로, PC 는 새 탭으로 연다. 누른 직후에 열어야 브라우저가 막지 않는다
function openApp(appUrl, androidIntent, webUrl) {
  if (MOBILE) { P.location.href = ANDROID && androidIntent ? androidIntent : appUrl; }
  else if (webUrl) { P.open(webUrl, "_blank", "noopener"); }
}

document.getElementById("kakao").onclick = async () => {
  // 1) 카카오 키가 있으면 카카오톡 공유 창 (휴대폰은 카카오톡 앱, PC 는 공유 창) → 친구 고르면 포스터 카드로 보낸다
  if (A.kakao_key) {
    try {
      await loadKakao();
      const url = link();
      Kakao.Share.sendDefault({
        objectType: "feed",
        content: { title: A.title, description: A.text, imageUrl: new URL(A.image, P.location.href).href,
                   link: { mobileWebUrl: url, webUrl: url } },
        buttons: [{ title: "자세히 보기", link: { mobileWebUrl: url, webUrl: url } }],
      });
      say("카카오톡 공유 창을 열었어요 💬");
      return;
    } catch (e) { /* 키·도메인 설정이 안 맞으면 아래 방법으로 */ }
  }
  // 2) 키가 없으면: 링크를 복사하고 카카오톡을 연다 (채팅방에 붙여 넣으면 된다)
  await copy(MOBILE ? "링크를 복사했어요. 카카오톡이 열리면 채팅방에 붙여 넣어 주세요 💬"
                    : "링크를 복사했어요. 카카오톡 PC 에서 채팅방에 붙여 넣어 주세요 💬");
  openApp("kakaotalk://launch",
          "intent://launch#Intent;scheme=kakaotalk;package=com.kakao.talk;end", null);
};

document.getElementById("insta").onclick = async () => {
  // 인스타그램은 웹에서 링크를 넣어 공유하는 기능이 없다 → 링크를 복사하고 인스타 DM 을 연다
  await copy("링크를 복사했어요. 인스타그램 DM 에 붙여 넣어 보내 주세요 📷");
  openApp("instagram://direct-inbox",
          "intent://direct-inbox#Intent;scheme=instagram;package=com.instagram.android;end",
          "https://www.instagram.com/direct/inbox/");
};

document.getElementById("copy").onclick = () => copy("링크를 복사했어요 ✨");

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  A = event.data.args || {};
});
</script>
</body>
</html>
