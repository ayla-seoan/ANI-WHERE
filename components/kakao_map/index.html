<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  /* 포인트 컬러 (map-template.html) — 이 두 줄만 바꾸면 지도 전체 톤이 바뀐다 */
  :root { --accent: #14b8a6; --accent-soft: #e6fbf7; --line: #e5e7eb; --fg: #1a1d21; --muted: #6b7280; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
                      "Malgun Gothic", "Noto Sans KR", sans-serif; }
  #map { width: 100%; height: 100%; border-radius: 14px; overflow: hidden; background: var(--line);
         border: 1px solid var(--line); }
  /* 핀: 물방울 모양 (네모를 45도 돌려 한쪽 모서리만 뾰족하게). 고른 카페는 크고 분홍 */
  .pin {
    width: 26px; height: 26px; border-radius: 50% 50% 50% 0; cursor: pointer;
    background: var(--accent); transform: rotate(-45deg); border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(20, 184, 166, .45); transition: filter .12s;
  }
  .pin:hover { filter: brightness(1.12); }
  .pin.sel { width: 34px; height: 34px; background: #ff8fa3; box-shadow: 0 2px 10px rgba(255, 143, 163, .55); }
  /* 지도 그림 바꾸기 버튼 (오른쪽 위): 밝은 회색 / 컬러 / 다크 */
  #styles { position: absolute; top: 10px; right: 10px; z-index: 900; display: flex; gap: 6px; }
  #styles button { font: inherit; font-size: 12px; padding: 5px 11px; cursor: pointer; background: #fff;
                   color: var(--fg); border: 1px solid var(--line); border-radius: 999px;
                   box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  #styles button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent);
                                        background: var(--accent-soft); font-weight: 700; }
  /* 지도 그림 색: 밝은 회색 = 흑백, 다크 = 흑백을 뒤집은 것.
     대비를 세게 줘서 옅은 바탕·도로는 더 옅게(다크는 더 어둡게), 진한 지명 글자는 더 또렷하게 남긴다 */
  .tiles-light { filter: grayscale(1) contrast(1.3) brightness(1.06); }
  .tiles-dark { filter: grayscale(1) invert(1) contrast(1.3) brightness(.95); }
  #map.dark { background: #1f2224; }
  /* 커서를 올리면 뜨는 카드: 포스터 · 작품 · 카페 · 위치 · 기간 */
  .card { width: 250px; background: #fff; border-radius: 14px; padding: 8px; border-top: 3px solid var(--accent);
          box-shadow: 0 6px 20px rgba(0,0,0,.18); color: #26302d; font-size: 12px; line-height: 1.4;
          white-space: normal; pointer-events: none; }
  .card .item { display: flex; gap: 9px; align-items: flex-start; }
  .card .item + .item { margin-top: 8px; padding-top: 8px; border-top: 1px solid #eef2f0; }
  .card img { width: 58px; height: 78px; object-fit: cover; border-radius: 8px; flex: 0 0 auto;
              background: #f1f3f2; }
  .card .w { font-weight: 800; font-size: 13.5px; color: #0d9488; margin-bottom: 2px; }
  .card .c { font-weight: 600; margin-bottom: 3px; }
  .card .a { color: #5f6b67; font-size: 11.5px; }
  .card .d, #spot .d { color: var(--accent-deep, #0d9488); font-size: 11.5px; font-weight: 700; }
  .card .more { margin-top: 6px; color: #0d9488; font-weight: 700; font-size: 11.5px; }
  .kcard { position: relative; bottom: 40px; }
  /* 같은 자리에 팝업이 여러 개일 때 점을 누르면 뜨는 목록 창 */
  body { position: relative; }
  #spot { display: none; position: absolute; left: 12px; top: 12px; z-index: 1000; width: 250px;
          max-height: calc(100% - 24px); overflow-y: auto; background: #fff; border-radius: 14px;
          border-top: 3px solid var(--accent); color: #26302d; font-size: 12px; line-height: 1.4;
          box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 8px; }
  #spot.open { display: block; }
  #spot .head { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 6px;
                font-weight: 700; font-size: 11.5px; color: #5f6b67; }
  #spot .x { border: 0; background: #f1f3f2; width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
             font-size: 13px; line-height: 1; color: #5f6b67; }
  #spot .item { display: flex; gap: 9px; align-items: flex-start; padding: 4px; border-radius: 10px; cursor: pointer;
                transition: background .15s; }
  #spot .item:hover { background: var(--accent-soft); }
  #spot .item + .item { margin-top: 4px; padding-top: 8px; border-top: 1px solid #eef2f0; }
  #spot img { width: 58px; height: 78px; object-fit: cover; border-radius: 8px; flex: 0 0 auto; background: #f1f3f2; }
  #spot .w { font-weight: 800; font-size: 13.5px; color: #0d9488; margin-bottom: 2px; }
  #spot .c { font-weight: 600; margin-bottom: 3px; }
  #spot .a { color: #5f6b67; font-size: 11.5px; }
  #spot .go { margin-left: auto; color: var(--accent); font-size: 18px; }
  .leaflet-tooltip.tip-l { background: transparent; border: 0; box-shadow: none; padding: 0; }
  .leaflet-tooltip.tip-l::before { display: none; }
  .msg { padding: 24px; font-size: 13px; color: #6b6b76; line-height: 1.6; }
</style>
</head>
<body>
<div id="map"></div>
<div id="spot"></div>
<div id="styles"></div>

<script>
/* ---------- Streamlit 연결 (빌드 없이 쓰는 기본 핸드셰이크) ---------- */
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
const Streamlit = {
  ready: () => send("streamlit:componentReady", { apiVersion: 1 }),
  height: (h) => send("streamlit:setFrameHeight", { height: h }),
  value: (v) => send("streamlit:setComponentValue", { value: v, dataType: "json" }),
};

/* 지도는 아시아 밖으로 나가지 않는다. 등록되는 주소는 한국뿐이라 처음에는 한국을 비춘다 */
const ASIA = { south: -11, west: 60, north: 56, east: 150 };
const KOREA = { lat: 36.3, lng: 127.8 };
// 처음 화면: 북쪽 포천부터 남쪽 제주까지 (서쪽 제주·인천, 동쪽 포항·울산). 이 범위가 다 보이는 가장 큰 확대가
// 처음 화면이자 '가장 많이 축소한' 화면이다
const MAINLAND_JEJU = { south: 33.15, west: 126.1, north: 37.95, east: 129.45 };
// 처음 화면 범위: 앱이 넘겨주는 '팝업이 가장 많은 지역'(args.home). 없으면 포천~제주 전체
let HOME = null;
const homeBox = () => HOME || MAINLAND_JEJU;

function showMessage(html) {
  document.getElementById("map").innerHTML = '<div class="msg">' + html + "</div>";
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

function loadCss(href) {
  const l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = href;
  document.head.appendChild(l);
}

const pick = (id) => Streamlit.value({ id: id, at: Date.now() });

// 앱이 넘겨주는 포스터 주소는 페이지 기준 상대 주소라 바깥 페이지 주소를 기준으로 바꾼다
const abs = (u) => new URL(u, window.parent.location.href).href;
let ALL = [];
const sameSpot = (p) => ALL.filter((q) => q.lat === p.lat && q.lng === p.lng);

function closeSpot() { document.getElementById("spot").classList.remove("open"); spotOf = null; }

// 점을 눌렀을 때: 하나든 여럿이든 먼저 지도 안에 목록 창으로 미리 보여 준다.
// 목록의 팝업을 누르거나, 팝업이 하나인 점을 한 번 더 누르면 상세로 간다
let spotOf = null;      // 지금 열린 목록 창이 어느 점의 것인지 (점 id)
function onPick(p) {
  const here = sameSpot(p);
  const box = document.getElementById("spot");
  if (box.classList.contains("open") && here.length === 1 && spotOf === p.id) {
    closeSpot(); pick(p.id); return;
  }
  spotOf = p.id;
  box.innerHTML = "";
  const head = document.createElement("div"); head.className = "head";
  const t = document.createElement("span");
  t.textContent = here.length > 1 ? `이 자리의 팝업 ${here.length}곳` : "팝업 미리보기";
  const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = "닫기";
  x.onclick = (e) => { e.stopPropagation(); closeSpot(); };
  head.appendChild(t); head.appendChild(x); box.appendChild(head);
  here.forEach((q) => {
    const item = document.createElement("div"); item.className = "item";
    const img = document.createElement("img"); img.src = abs(q.poster); img.alt = "";
    const info = document.createElement("div");
    [["w", q.work], ["c", q.cafe], ["a", q.address], ["d", q.dates]].forEach(([cls, text]) => {
      const d = document.createElement("div"); d.className = cls; d.textContent = text; info.appendChild(d);
    });
    item.appendChild(img); item.appendChild(info);
    item.onclick = () => { closeSpot(); pick(q.id); };
    box.appendChild(item);
  });
  box.classList.add("open");
}

// 사용자가 입력한 글이라 HTML 로 넣지 않고 textContent 로 넣는다
function tipCard(p) {
  const card = document.createElement("div");
  card.className = "card";
  const here = sameSpot(p);
  const list = [p, ...here.filter((q) => q.id !== p.id)].slice(0, 3);
  list.forEach((q) => {
    const item = document.createElement("div"); item.className = "item";
    const img = document.createElement("img"); img.src = abs(q.poster); img.alt = "";
    const box = document.createElement("div");
    [["w", q.work], ["c", q.cafe], ["a", q.address], ["d", q.dates]].forEach(([cls, text]) => {
      const d = document.createElement("div"); d.className = cls; d.textContent = text; box.appendChild(d);
    });
    item.appendChild(img); item.appendChild(box); card.appendChild(item);
  });
  if (here.length > list.length) {
    const m = document.createElement("div"); m.className = "more";
    m.textContent = `+ 같은 곳에 ${here.length - list.length}곳 더 · 눌러서 모두 보기`; card.appendChild(m);
  }
  return card;
}

/* ---------- 카카오맵 (KAKAO_JS_KEY 가 있을 때) ---------- */
const Kakao = {
  map: null, overlays: [], tip: null,

  load(appKey) {
    return loadScript("https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=" +
                      encodeURIComponent(appKey))
      .then(() => new Promise((resolve, reject) => {
        // 도메인이 등록되지 않으면 준비가 끝나지 않고 멈추기도 해서, 6초 안에 안 되면 실패로 본다
        const t = setTimeout(() => reject(new Error("kakao maps timeout")), 6000);
        try { kakao.maps.load(() => { clearTimeout(t); resolve(); }); } catch (e) { clearTimeout(t); reject(e); }
      }));
  },

  init() {
    const K = kakao.maps;
    this.map = new K.Map(document.getElementById("map"), {
      center: new K.LatLng(KOREA.lat, KOREA.lng), level: 12,
    });
    this.overview();
    this.map.addControl(new K.ZoomControl(), K.ControlPosition.RIGHT);
    document.getElementById("styles").style.display = "none";   // 지도 그림 바꾸기는 기본 지도에서만
    // 카카오맵에는 이동 범위 옵션이 없어서, 벗어나면 가운데를 범위 안으로 되돌린다
    const clamp = () => {
      const c = this.map.getCenter();
      const lat = Math.min(ASIA.north, Math.max(ASIA.south, c.getLat()));
      const lng = Math.min(ASIA.east, Math.max(ASIA.west, c.getLng()));
      if (lat !== c.getLat() || lng !== c.getLng()) this.map.setCenter(new K.LatLng(lat, lng));
    };
    K.event.addListener(this.map, "dragend", clamp);
    K.event.addListener(this.map, "click", closeSpot);
    window.addEventListener("resize", () => this.map.relayout());
    K.event.addListener(this.map, "zoom_changed", clamp);
  },

  // 포천~제주가 다 보이게 맞추고, 그 화면보다 더 축소하지 못하게 한다
  // 축소 한계는 포천~제주 전체, 처음 화면은 팝업이 가장 많은 지역(homeBox)
  overview() {
    const K = kakao.maps;
    const box = (b) => new K.LatLngBounds(new K.LatLng(b.south, b.west), new K.LatLng(b.north, b.east));
    this.map.setMaxLevel(14);
    this.map.setBounds(box(MAINLAND_JEJU), 0, 0, 0, 0);
    this.map.setMaxLevel(this.map.getLevel());
    if (HOME) this.map.setBounds(box(HOME), 20, 20, 20, 20);
  },

  draw(points, selected) {
    const K = kakao.maps;
    this.overlays.forEach((o) => o.setMap(null));
    this.overlays = [];
    if (this.tip) { this.tip.setMap(null); this.tip = null; }

    points.forEach((p) => {
      const pos = new K.LatLng(p.lat, p.lng);
      const el = document.createElement("div");
      el.className = "pin" + (p.id === selected ? " sel" : "");
      el.onclick = () => onPick(p);
      el.onmouseenter = () => {
        const t = tipCard(p);
        t.classList.add("kcard");
        this.tip = new K.CustomOverlay({ position: pos, content: t, yAnchor: 1, zIndex: 3 });
        this.tip.setMap(this.map);
      };
      el.onmouseleave = () => { if (this.tip) { this.tip.setMap(null); this.tip = null; } };
      // 물방울 핀은 아래 뾰족한 끝이 카페 자리에 오도록 아래 가운데를 기준점으로 둔다
      const o = new K.CustomOverlay({
        position: pos, content: el, zIndex: p.id === selected ? 2 : 1, clickable: true, xAnchor: 0.5, yAnchor: 1.15,
      });
      o.setMap(this.map);
      this.overlays.push(o);
    });
  },

  // 상세: 그 카페 위치로 바로 옮긴다 (부드럽게 옮기는 panTo 대신 setCenter — 전국 보기 이동에 덮이지 않게)
  focus(p) { this.map.setLevel(4); this.map.setCenter(new kakao.maps.LatLng(p.lat, p.lng)); },
  fit() { this.overview(); },
};

/* ---------- 기본 지도 (키가 없을 때: Leaflet + OpenStreetMap) ---------- */
const Basic = {
  map: null, layer: null,

  load() {
    loadCss("https://unpkg.com/leaflet@1.9.4/dist/leaflet.css");
    return loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js");
  },

  init() {
    const asia = L.latLngBounds([ASIA.south, ASIA.west], [ASIA.north, ASIA.east]);
    this.map = L.map("map", {
      center: [KOREA.lat, KOREA.lng], zoom: 7,
      zoomSnap: 0.25,            // 0.25 단위로 맞춰 포천~제주가 지도 칸에 꽉 차게
      maxBounds: asia, maxBoundsViscosity: 1.0,   // 범위 끝에서 더 끌리지 않는다
    });
    this.overview();
    // 지도 칸 크기가 바뀌면 축소 한계만 다시 잰다 (보고 있던 위치는 그대로)
    // 처음 맞출 때 지도 칸 크기가 아직 0 이었으면(화면에 막 붙는 중) 크기가 생긴 뒤 처음 화면으로 다시 맞춘다
    window.addEventListener("resize", () => this.overview(this.homePending));
    this.styles();
    this.layer = L.layerGroup().addTo(this.map);
    // 점을 눌러도 지도가 마우스를 붙잡아 클릭이 점에 오지 않을 때가 있고, 누르는 순간 브라우저가 지도 칸에
    // 초점을 주며 페이지를 스크롤해 뗄 때의 위치가 어긋나기도 한다. 그래서 '누른 순간의 위치' 에서
    // 12px 안의 가장 가까운 점을 처리한다. 지도를 끌었으면 무시하고, 점이 없으면 목록 창을 닫는다
    let downAt = null, dragged = false;
    const box = this.map.getContainer();
    box.addEventListener("pointerdown", (ev) => {
      downAt = this.map.mouseEventToContainerPoint(ev); dragged = false;
    }, true);
    this.map.on("dragstart", () => { dragged = true; });
    box.addEventListener("click", (ev) => {
      if (ev.target.closest && ev.target.closest(".leaflet-control")) return;      // 확대·축소 버튼은 그대로
      if (dragged || !downAt) return;
      let best = null, bestD = 18;
      ALL.forEach((p) => {
        const q = this.map.latLngToContainerPoint([p.lat, p.lng]);
        const d = Math.hypot(q.x - downAt.x, q.y - 16 - downAt.y);   // 핀 몸통은 자리보다 위에 있다
        if (d < bestD) { bestD = d; best = p; }
      });
      if (best) { this.layer.eachLayer((l) => l.closeTooltip()); onPick(best); }
      else closeSpot();
    }, true);
  },

  // 지도 그림(타일) 3가지 — map-template.html 의 '밝은 회색 / 컬러 / 다크'.
  // 템플릿의 CARTO 는 이제 키가 있어야 해서("API KEY REQUIRED"), 키 없이 되는 Esri 회색 지도와 OpenStreetMap 을 쓴다.
  // 고른 그림은 이 브라우저에 기억해 둔다
  styles() {
    // 세 가지 모두 같은 OpenStreetMap 지도(한글 지명이 다 나온다)를 쓰고, 색만 CSS 필터로 바꾼다.
    // (Esri 회색 지도는 지명이 적고 영어라서 바꿨다. 필터는 지도 그림에만 걸고 핀에는 걸지 않는다)
    const OSM = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
    const STYLES = { "밝은 회색": "tiles-light", "컬러": "", "다크": "tiles-dark" };
    let saved = "밝은 회색";
    try { saved = localStorage.getItem("aniwhere-map-style") || saved; } catch (e) {}
    if (!STYLES[saved]) saved = "밝은 회색";
    let layers = [];
    const use = (key) => {
      layers.forEach((l) => this.map.removeLayer(l));
      layers = [L.tileLayer(OSM, { attribution: "&copy; OpenStreetMap", maxZoom: 19, className: STYLES[key] })
                  .addTo(this.map)];
      document.getElementById("map").classList.toggle("dark", key === "다크");
      layers.forEach((l) => l.bringToBack());
      [...bar.children].forEach((b) => b.setAttribute("aria-pressed", b.textContent === key ? "true" : "false"));
      try { localStorage.setItem("aniwhere-map-style", key); } catch (e) {}
    };
    const bar = document.getElementById("styles");
    bar.innerHTML = "";
    Object.keys(STYLES).forEach((key) => {
      const b = document.createElement("button");
      b.textContent = key;
      b.onclick = (e) => { e.stopPropagation(); use(key); };
      bar.appendChild(b);
    });
    use(saved);
  },

  draw(points, selected) {
    this.layer.clearLayers();
    points.forEach((p) => {
      const sel = p.id === selected;
      // 물방울 핀 (map-template.html): 아래 뾰족한 끝이 카페 자리. 고른 카페는 크고 분홍
      const size = sel ? 34 : 26;
      const icon = L.divIcon({ className: "", html: `<div class="pin${sel ? " sel" : ""}"></div>`,
                               iconSize: [size, size], iconAnchor: [size / 2, size + 4] });
      L.marker([p.lat, p.lng], { icon, zIndexOffset: sel ? 1000 : 0, bubblingMouseEvents: false })
        .bindTooltip(() => tipCard(p), { className: "tip-l", direction: "top", offset: [0, -size - 6], opacity: 1 })
        .addTo(this.layer);
    });
  },

  // 포천~제주가 다 보이는 가장 큰 확대로 맞추고, 그보다 더 축소하지 못하게 한다 (지도 칸 크기가 바뀌면 다시)
  overview(move = true) {
    const b = L.latLngBounds([MAINLAND_JEJU.south, MAINLAND_JEJU.west], [MAINLAND_JEJU.north, MAINLAND_JEJU.east]);
    this.map.invalidateSize();
    const size = this.map.getSize();
    if (move && (size.x < 50 || size.y < 50)) {             // 아직 크기가 없으면 맞추지 않고 다음 resize 를 기다린다
      this.homePending = true;
      setTimeout(() => { if (this.homePending) this.overview(true); }, 300);
      return;
    }
    this.homePending = false;
    this.map.setMinZoom(this.map.getBoundsZoom(b));      // 축소 한계는 포천~제주 전체
    if (move) {                                             // 처음 화면은 내 주변 (위치를 모르면 팝업이 가장 많은 지역)
      const h = homeBox();
      this.focused = null;
      this.map.fitBounds(L.latLngBounds([h.south, h.west], [h.north, h.east]),
                         { animate: false, padding: [20, 20], maxZoom: 15 });   // 너무 확대되지 않게
    }
    // 칸 크기가 바뀌어도 상세에서 보던 카페 위치는 그대로 가운데에 둔다
    else if (this.focused) this.map.setView([this.focused.lat, this.focused.lng], this.map.getZoom(), { animate: false });
  },

  // 상세: 그 카페 위치로 바로 옮긴다. 움직임(애니메이션) 없이 옮겨야, 먼저 시작된 '전국 보기' 이동이
  // 끝나면서 다시 전국으로 덮어쓰는 일이 없다
  focus(p) {
    this.focused = p;
    this.map.stop();
    this.map.setView([p.lat, p.lng], 15, { animate: false });
  },
  fit() { this.overview(); },
};

/* ---------- 공통 ---------- */
let engine = null;
let ready = null;         // 지도 라이브러리 로딩
let loaded = false;       // 로딩에 성공했을 때만 그린다
let pending = null;       // 로딩 중에 받은 데이터
let lastView = "";        // 선택·점 목록이 바뀔 때만 화면을 옮긴다 (사용자가 움직인 화면 유지)

function draw(args) {
  const points = args.points || [];
  const selected = args.selected;
  ALL = points;
  if (!engine.map) engine.init();
  engine.draw(points, selected);

  const view = JSON.stringify([selected, points.map((p) => p.id), HOME]);
  if (view === lastView || !points.length) return;
  lastView = view;
  const focus = points.find((p) => p.id === selected);
  if (focus) engine.focus(focus);
  else if (points.length === 1) engine.focus(points[0]);
  else {
    engine.fit(points);
    // 처음 그릴 때 지도 칸이 아직 자리를 잡는 중이면 맞춘 범위가 전국으로 풀려 버린다.
    // 사용자가 지도를 건드리지 않았으면 잠시 뒤 한 번 더 처음 화면(내 주변)으로 맞춘다
    touched = false;
    const again = view;
    [400, 1200].forEach((ms) => setTimeout(() => { if (!touched && lastView === again) engine.fit(points); }, ms));
  }
}
let touched = false;      // 사용자가 지도를 끌거나 확대·축소했는지
["pointerdown", "wheel", "touchstart"].forEach((t) =>
  document.getElementById("map").addEventListener(t, () => { touched = true; }, { passive: true, capture: true }));

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  HOME = args.home || null;
  // 지도는 iframe 높이를 그대로 채운다 (앱 CSS 가 화면 높이에 맞춰 iframe 높이를 바꿀 수 있다)
  Streamlit.height(args.height || 600);

  pending = args;
  if (!ready) {
    // 카카오 키가 있으면 카카오맵, 못 불러오면(도메인 미등록 등) 기본 지도로 바꿔 그린다 (지도가 비지 않게)
    const useBasic = () => { engine = Basic; return Basic.load(); };
    const fail = () => showMessage("지도를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
    engine = args.app_key ? Kakao : Basic;
    ready = (args.app_key
      ? Kakao.load(args.app_key).then(
          () => { if (!(window.kakao && kakao.maps && kakao.maps.LatLng)) throw new Error("kakao maps not ready"); },
        ).catch(() => {
          console.warn("카카오맵을 불러오지 못해 기본 지도로 표시합니다. 카카오 개발자 콘솔 > 플랫폼 > Web 에 이 주소를 등록했는지 확인해 주세요.");
          return useBasic();
        })
      : Basic.load()
    ).then(() => { loaded = true; draw(pending); }, fail);
  } else if (loaded) {
    draw(args);
  }
});

Streamlit.ready();
Streamlit.height(600);
</script>
</body>
</html>
