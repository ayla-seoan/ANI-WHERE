# 매일 아침 Notion 트래커 → 앱 데이터 가져오기
# Notion 매일 수집(08:00 KST, 약 20~30분)이 끝난 뒤 08:40 KST 에 돌고, 바뀐 게 있으면 data/cafes.json · 포스터를 커밋한다.
# 필요한 Secret: NOTION_TOKEN (필수), KAKAO_REST_API_KEY (선택 — Notion 에 좌표가 없는 곳의 위치 찾기),
#   WEB_REVALIDATE_SECRET (선택 — 가져온 직후 공개 웹 캐시 비우기)
name: Notion 매일 가져오기

on:
  schedule:
    - cron: "40 23 * * *"      # 매일 23:40 UTC = 다음 날 08:40 KST
    # 예비 (11/19): GitHub 예약 실행은 몇 시간씩 늦거나 빠질 때가 있다 (11/18 은 5시간 늦게, 11/19 는 10시가 넘도록 안 돎).
    # 다시 돌아도 바뀐 게 없으면 한 줄도 쌓지 않으니(notion_sync.import_rows) 몇 번 더 돌려 둔다: 09:40 · 11:40 · 14:40 KST
    - cron: "40 0 * * *"
    - cron: "40 2 * * *"
    - cron: "40 5 * * *"
  workflow_dispatch:            # Actions 탭에서 'Run workflow' 로 바로 돌릴 수 있다

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Notion 에서 가져오기
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          # Secret 에 SUPABASE_URL 이 있으면 Notion → Supabase 로 바로 넣고 data/cafes.json 은 거울로 남긴다 (db.md)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STORAGE_MODE: ${{ secrets.SUPABASE_URL != '' && 'supabase' || 'local' }}
          # (선택) 새 팝업을 넣은 뒤 공개 웹의 10분 캐시를 바로 비운다. Vercel 의 WEB_REVALIDATE_SECRET 과 같은 값
          WEB_REVALIDATE_SECRET: ${{ secrets.WEB_REVALIDATE_SECRET }}
        run: python scripts/notion_import.py

      - name: 쓰지 않는 사진 파일 지우기
        # 월요일 DB 정리(supabase 012)로 지운 팝업 · 리뷰의 사진 파일. 012 정책상 '안 쓰는 · 하루 지난' 파일만 지울 수 있다
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/storage_sweep.py

      - name: 바뀐 데이터 올리기
        run: |
          git add data/cafes.json static/uploads
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
            exit 0
          fi
          git config user.name "ani-where-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Notion 매일 가져오기 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push
