<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>A 말랑 핀 지도로 보기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#0d9488}a:hover{color:#0b7a70}
</style>
</helmet>
<div style="font-family: 'Noto Sans KR', sans-serif; color: #26302d; background: #ffffff; min-height: 860px; display: flex; flex-direction: column">

  <header style="background: #e9f7f2; border-radius: 0 0 28px 28px; padding: 12px 24px">
    <div style="max-width: 1232px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <a href="A-Home.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #26302d">
        <img src="../assets/aniwhere_logo.png" alt="ANI:WHERE 홈" style="height: 48px; width: auto; display: block">
      </a>
      <nav aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 4px">
        <a href="A-Home.dc.html" style="padding: 9px 18px; border-radius: 999px; color: #26302d; font-weight: 600; font-size: 15px; text-decoration: none">홈</a>
        <a href="#" style="padding: 9px 18px; border-radius: 999px; background: #ffffff; color: #1f2a27; font-weight: 800; font-size: 15px; text-decoration: none">지도로 보기</a>
        <a href="#" style="padding: 9px 18px; border-radius: 999px; color: #26302d; font-weight: 600; font-size: 15px; text-decoration: none">리스트로 보기</a>
        <a href="#" style="padding: 9px 18px; border-radius: 999px; color: #26302d; font-weight: 600; font-size: 15px; text-decoration: none">내 캘린더</a>
      </nav>
      <div style="display: flex; align-items: center; gap: 6px">
        <button aria-label="검색" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #ffffff; color: #26302d; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{ic.search}}"></path></svg></button>
        <button aria-label="마이페이지" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #ffffff; background: #ffd6dc; cursor: pointer"></button>
      </div>
    </div>
  </header>

  <main style="flex: 1; padding: 16px 24px 24px; display: flex; flex-wrap: wrap; gap: 16px; box-sizing: border-box">

    <aside aria-labelledby="a-note" style="flex: 1 1 260px; max-width: 300px; display: flex; flex-direction: column; gap: 12px; background: #f6f8f7; border-radius: 18px; padding: 16px; box-sizing: border-box">
      <h2 id="a-note" style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 22px">데일리 팝업 노트</h2>
      <div style="display: flex; align-items: center; justify-content: space-between; background: #ffffff; border-radius: 999px; padding: 4px">
        <button aria-label="전날" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; cursor: pointer; color: #26302d; transform: scaleX(-1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="{{ic.chev}}"></path></svg></button>
        <span style="font-size: 14px; font-weight: 800">11월 25일 (수)</span>
        <button aria-label="다음 날" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; cursor: pointer; color: #26302d"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="{{ic.chev}}"></path></svg></button>
      </div>
      <div style="font-size: 13px; color: #5f6b68">내 위치에서 가까운 <strong style="color: #0f6b5c">서울 마포구</strong>부터</div>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{notes}}" as="n" hint-placeholder-count="5">
          <li>
            <button style="width: 100%; font-family: inherit; text-align: left; display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; border: {{n.border}}; background: #ffffff; cursor: pointer; color: #26302d">
              <span style="width: 40px; height: 52px; border-radius: 8px; background: {{n.bg}}; flex: none"></span>
              <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
                <span style="font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</span>
                <span style="font-size: 12.5px; color: #5f6b68">{{n.place}}</span>
                <span style="align-self: flex-start; font-size: 11.5px; font-weight: 800; color: {{n.fg}}; background: {{n.sbg}}; padding: 1px 8px; border-radius: 999px">{{n.state}}</span>
              </span>
            </button>
          </li>
        </sc-for>
      </ul>
    </aside>

    <section aria-label="지도" style="flex: 999 1 480px; min-width: 0; min-height: 520px; position: relative; overflow: hidden; border-radius: 18px; background: #eef3f1">
      <div style="position: absolute; left: -10%; top: 58%; width: 130%; height: 70px; background: #cfe6ee; transform: rotate(-8deg)"></div>
      <div style="position: absolute; left: 0; top: 30%; width: 100%; height: 10px; background: #ffffff"></div>
      <div style="position: absolute; left: 34%; top: 0; width: 12px; height: 100%; background: #ffffff; transform: rotate(14deg)"></div>
      <div style="position: absolute; left: 68%; top: 0; width: 8px; height: 100%; background: #ffffff"></div>
      <div style="position: absolute; left: 8%; top: 8%; width: 150px; height: 90px; border-radius: 22px; background: #dcefe3"></div>
      <div style="position: absolute; left: 72%; top: 70%; width: 130px; height: 80px; border-radius: 22px; background: #dcefe3"></div>
      <span style="position: absolute; left: 12%; top: 22%; font-size: 12px; font-weight: 700; color: #5f6b68">연남동</span>
      <span style="position: absolute; left: 47%; top: 38%; font-size: 12px; font-weight: 700; color: #5f6b68">서교동</span>
      <span style="position: absolute; left: 74%; top: 20%; font-size: 12px; font-weight: 700; color: #5f6b68">신촌</span>

      <sc-for list="{{pins}}" as="p" hint-placeholder-count="5">
        <svg style="position: absolute; left: {{p.x}}; top: {{p.y}}" width="32" height="36" viewBox="0 0 64 72" role="img" aria-label="{{p.label}}"><path d="M32 4C17.6 4 7 14.6 7 28.5 7 45 32 68 32 68S57 45 57 28.5C57 14.6 46.4 4 32 4Z" fill="#14b8a6" stroke="#ffffff" stroke-width="4"></path><circle cx="25" cy="28" r="4.6" fill="#1f2a27"></circle><circle cx="39" cy="28" r="4.6" fill="#1f2a27"></circle></svg>
      </sc-for>

      <svg style="position: absolute; left: 44%; top: 40%" width="52" height="58" viewBox="0 0 64 72" role="img" aria-label="고른 팝업: 치이카와 팝업 스토어"><path d="M32 4C17.6 4 7 14.6 7 28.5 7 45 32 68 32 68S57 45 57 28.5C57 14.6 46.4 4 32 4Z" fill="#ff6b9a" stroke="#ffffff" stroke-width="4"></path><circle cx="25" cy="28" r="4" fill="#1f2a27"></circle><circle cx="39" cy="28" r="4" fill="#1f2a27"></circle><path d="M28.5 35.5q3.5 3.2 7 0" stroke="#1f2a27" stroke-width="2.4" stroke-linecap="round" fill="none"></path></svg>

      <a href="A-Detail.dc.html" style="position: absolute; left: calc(44% + 60px); top: calc(40% - 40px); width: 250px; background: #ffffff; border-radius: 16px; padding: 12px; display: flex; gap: 12px; text-decoration: none; color: #26302d; box-shadow: 0 4px 14px rgba(0,0,0,.14)">
        <span style="width: 64px; height: 84px; border-radius: 10px; background: #ffd6dc; flex: none"></span>
        <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="align-self: flex-start; font-size: 11.5px; font-weight: 800; color: #0b5e57; background: #e6fbf7; padding: 1px 8px; border-radius: 999px">진행 중</span>
          <span style="font-family: 'Jua', sans-serif; font-size: 17px; line-height: 1.2">치이카와 팝업 스토어</span>
          <span style="font-size: 12.5px; color: #5f6b68">홍대 · ~ 12.15</span>
          <span style="font-size: 12.5px; font-weight: 700; color: #0f6b5c">한 번 더 누르면 상세</span>
        </span>
      </a>

      <span style="position: absolute; left: 30%; top: 66%; width: 16px; height: 16px; border-radius: 50%; background: #2c5bc5; border: 3px solid #ffffff; box-shadow: 0 0 0 8px rgba(44,91,197,.18)" aria-label="내 위치" role="img"></span>

      <div style="position: absolute; right: 14px; top: 14px; display: flex; background: #ffffff; border-radius: 999px; padding: 4px; gap: 2px; box-shadow: 0 2px 10px rgba(0,0,0,.06)">
        <button style="font-family: inherit; font-size: 12.5px; font-weight: 800; border: 0; border-radius: 999px; padding: 6px 12px; background: #e6fbf7; color: #0b5e57; cursor: pointer">밝은 회색</button>
        <button style="font-family: inherit; font-size: 12.5px; border: 0; border-radius: 999px; padding: 6px 12px; background: none; color: #26302d; cursor: pointer">컬러</button>
        <button style="font-family: inherit; font-size: 12.5px; border: 0; border-radius: 999px; padding: 6px 12px; background: none; color: #26302d; cursor: pointer">다크</button>
      </div>
      <button aria-label="내 위치로" style="position: absolute; right: 14px; bottom: 14px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: #ffffff; color: #2c5bc5; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,.14); cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="{{ic.locate}}"></path></svg></button>
    </section>

    <aside aria-labelledby="a-ask" style="flex: 1 1 300px; max-width: 340px; display: flex; flex-direction: column; border: 1.5px solid #9eddcc; border-radius: 18px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #e9f7f2">
        <img src="../assets/aniwhere_mascot.png" alt="" style="width: 36px; height: auto; display: block">
        <h2 id="a-ask" style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 19px; color: #0f6b5c">ANI:WHERE에게 물어보기</h2>
      </div>
      <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #ffffff">
        <div style="align-self: flex-end; max-width: 80%; background: #14b8a6; color: #ffffff; font-size: 14px; font-weight: 600; padding: 10px 14px; border-radius: 18px 18px 4px 18px">이번 주말 홍대 근처 팝업 있어?</div>
        <div style="max-width: 92%; background: #f6f8f7; font-size: 14px; line-height: 1.6; padding: 12px 14px; border-radius: 18px 18px 18px 4px">네, 이번 주말 홍대 근처에서 하는 팝업이 <strong style="color: #0f6b5c">3건</strong> 있어요.</div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{answers}}" as="a" hint-placeholder-count="3">
            <a href="A-Detail.dc.html" style="display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px solid #e3e9e7; border-radius: 12px; text-decoration: none; color: #26302d">
              <span style="width: 34px; height: 44px; border-radius: 7px; background: {{a.bg}}; flex: none"></span>
              <span style="display: flex; flex-direction: column; min-width: 0">
                <span style="font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.t}}</span>
                <span style="font-size: 12px; color: #5f6b68">{{a.s}}</span>
              </span>
            </a>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto">
          <button style="font-family: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid #9eddcc; background: #ffffff; color: #0f6b5c; cursor: pointer">곧 끝나는 팝업</button>
          <button style="font-family: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid #9eddcc; background: #ffffff; color: #0f6b5c; cursor: pointer">팝업 추천해줘</button>
          <button style="font-family: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid #9eddcc; background: #ffffff; color: #0f6b5c; cursor: pointer">내 주변</button>
        </div>
      </div>
      <form style="display: flex; gap: 8px; padding: 12px; border-top: 1px solid #eef2f1; background: #ffffff">
        <label for="a-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">질문</label>
        <input id="a-q" placeholder="예: 12월 부산 팝업" style="flex: 1; min-width: 0; font-family: inherit; font-size: 14px; padding: 10px 14px; border-radius: 999px; border: 1px solid #e3e9e7; background: #f6f8f7; color: #26302d">
        <button aria-label="보내기" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #14b8a6; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.send}}"></path></svg></button>
      </form>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      ic: {
        search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M20 20l-4-4',
        chev: 'M9 6l6 6-6 6',
        locate: 'M12 19a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M12 2v3 M12 19v3 M2 12h3 M19 12h3',
        send: 'M4 12l16-8-6 16-2.5-6.5z'
      },
      notes: [
        { title: '치이카와 팝업 스토어', place: '홍대 · ~ 12.15', bg: '#ffd6dc', state: '진행 중', fg: '#0b5e57', sbg: '#e6fbf7', border: '2px solid #14b8a6' },
        { title: '원피스 굿즈 팝업', place: '홍대 · 11.28 ~', bg: '#d9e4ff', state: 'D-3', fg: '#2c5bc5', sbg: '#eaf0fc', border: '1px solid #e3e9e7' },
        { title: '하이큐!! 굿즈', place: '연남 · ~ 11.25', bg: '#ffe6c2', state: '마감임박', fg: '#c0313f', sbg: '#fdecee', border: '1px solid #e3e9e7' },
        { title: '블루 아카이브 전시', place: '성수 · ~ 12.31', bg: '#efe0ff', state: '진행 중', fg: '#0b5e57', sbg: '#e6fbf7', border: '1px solid #e3e9e7' },
        { title: '주술회전 콜라보 카페', place: '성수 · ~ 12.08', bg: '#d6f2e9', state: '진행 중', fg: '#0b5e57', sbg: '#e6fbf7', border: '1px solid #e3e9e7' }
      ],
      pins: [
        { x: '18%', y: '30%', label: '원피스 굿즈 팝업' },
        { x: '26%', y: '48%', label: '하이큐!! 굿즈' },
        { x: '62%', y: '24%', label: '스파이 패밀리 카페' },
        { x: '76%', y: '52%', label: '블루 아카이브 전시' },
        { x: '58%', y: '76%', label: '주술회전 콜라보 카페' }
      ],
      answers: [
        { t: '치이카와 팝업 스토어', s: '홍대 · 진행 중', bg: '#ffd6dc' },
        { t: '원피스 굿즈 팝업', s: '홍대 · 11.28 오픈', bg: '#d9e4ff' },
        { t: '하이큐!! 굿즈', s: '연남 · 오늘 종료', bg: '#ffe6c2' }
      ]
    };
  }
}
</script>
</body>
</html>
