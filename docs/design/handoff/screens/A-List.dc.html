<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>A 리스트로 보기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#0d9488}a:hover{color:#0b7a70}
</style>
</helmet>
<div style="font-family: 'Noto Sans KR', sans-serif; color: #26302d; background: #ffffff; min-height: 1500px">

  <header style="background: #e9f7f2; border-radius: 0 0 28px 28px; padding: 12px 24px">
    <div style="max-width: 1232px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <a href="A-Home.dc.html" style="display: flex; align-items: center; text-decoration: none"><img src="../assets/aniwhere_logo.png" alt="ANI:WHERE 홈" style="height: 48px; width: auto; display: block"></a>
      <nav aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 4px">
        <a href="A-Home.dc.html" style="padding: 9px 18px; border-radius: 999px; color: #26302d; font-weight: 600; font-size: 15px; text-decoration: none">홈</a>
        <a href="A-Map.dc.html" style="padding: 9px 18px; border-radius: 999px; color: #26302d; font-weight: 600; font-size: 15px; text-decoration: none">지도로 보기</a>
        <a href="#" style="padding: 9px 18px; border-radius: 999px; background: #ffffff; color: #1f2a27; font-weight: 800; font-size: 15px; text-decoration: none">리스트로 보기</a>
        <a href="A-Cal.dc.html" style="padding: 9px 18px; border-radius: 999px; color: #26302d; font-weight: 600; font-size: 15px; text-decoration: none">내 캘린더</a>
      </nav>
      <div style="position: relative; display: flex; align-items: center; gap: 6px">
        <button aria-label="검색 닫기" aria-expanded="true" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #14b8a6; background: #ffffff; color: #0b5e57; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="{{ic.search}}"></path></svg></button>
        <button aria-label="알림" style="position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #ffffff; color: #26302d; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.bell}}"></path></svg><span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: #ff6b6b"></span></button>
        <button aria-label="마이페이지" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #ffffff; background: #ffd6dc; cursor: pointer"></button>
      </div>
    </div>
  </header>

  <div style="max-width: 1232px; margin: 0 auto; padding: 0 24px">
    <form aria-label="검색 필터" style="position: relative; margin: 14px 0 0 auto; max-width: 860px; background: #ffffff; border: 1.5px solid #9eddcc; border-radius: 18px; padding: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.08); display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
      <span aria-hidden="true" style="position: absolute; right: 106px; top: -9px; width: 16px; height: 16px; background: #ffffff; border-left: 1.5px solid #9eddcc; border-top: 1.5px solid #9eddcc; transform: rotate(45deg)"></span>
      <label style="flex: 2 1 200px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 700; color: #5f6b68">검색<input placeholder="작품·카페 이름" value="치이" style="font-family: inherit; font-size: 14px; padding: 10px 12px; border-radius: 12px; border: 1px solid #e3e9e7; color: #26302d"></label>
      <label style="flex: 1 1 120px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 700; color: #5f6b68">작품<select style="font-family: inherit; font-size: 14px; padding: 10px; border-radius: 12px; border: 1px solid #e3e9e7; color: #26302d; background: #ffffff"><option>전체</option></select></label>
      <label style="flex: 1 1 120px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 700; color: #5f6b68">캐릭터<select style="font-family: inherit; font-size: 14px; padding: 10px; border-radius: 12px; border: 1px solid #e3e9e7; color: #26302d; background: #ffffff"><option>전체</option></select></label>
      <label style="flex: 1 1 120px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 700; color: #5f6b68">진행여부<select style="font-family: inherit; font-size: 14px; padding: 10px; border-radius: 12px; border: 1px solid #14b8a6; color: #0b5e57; background: #e6fbf7; font-weight: 700"><option>진행 중</option></select></label>
      <label style="flex: 1 1 130px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 700; color: #5f6b68">날짜<input value="날짜 고르기" style="font-family: inherit; font-size: 14px; padding: 10px 12px; border-radius: 12px; border: 1px solid #e3e9e7; color: #5f6b68"></label>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #f4f6f5; color: #26302d; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">초기화</button>
    </form>
  </div>

  <main style="max-width: 1232px; margin: 0 auto; padding: 18px 24px 64px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
    <section aria-labelledby="l-count" style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
        <h1 id="l-count" style="margin: 0 8px 0 0; font-size: 18px; font-weight: 800">팝업 카페 <span style="color: #0f6b5c">8곳</span></h1>
        <button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #e3e9e7; background: #ffffff; color: #26302d; font-family: inherit; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.bookmark}}"></path></svg>북마크</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #14b8a6; background: #e6fbf7; color: #0b5e57; font-family: inherit; font-size: 13.5px; font-weight: 800; cursor: pointer">서울 · 부산 ✕</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #e3e9e7; background: #ffffff; color: #26302d; font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer">+ 지역 고르기</button>
        <label style="margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5f6b68">정렬<select style="height: 40px; font-family: inherit; font-size: 13.5px; font-weight: 700; padding: 0 10px; border-radius: 999px; border: 1.5px solid #e3e9e7; background: #ffffff; color: #26302d"><option>최신순</option><option>종료 임박순</option><option>별점순</option></select></label>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px 16px">
        <sc-for list="{{cards}}" as="p" hint-placeholder-count="8">
          <a href="A-Detail.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #26302d">
            <span style="position: relative; display: block; aspect-ratio: 3 / 4; border: 2.5px solid {{p.line}}; border-radius: 12px; background: {{p.bg}}; box-sizing: border-box; overflow: hidden; box-shadow: {{p.shadow}}">
              <span style="position: absolute; left: 10px; top: 10px; font-size: 12px; font-weight: 800; color: {{p.fg}}; background: {{p.sbg}}; padding: 2px 10px; border-radius: 999px">{{p.state}}</span>
              <span style="position: absolute; right: 10px; top: 10px; font-size: 12px; font-weight: 800; color: #ffffff; background: {{p.abg}}; border: 1.5px solid rgba(255,255,255,.85); padding: 1px 9px; border-radius: 999px">{{p.area}}</span>
              <span style="position: absolute; left: 10px; bottom: 12px; max-width: 110px; font-size: 12px; font-weight: 700; color: #26302d; background: rgba(255,255,255,.92); padding: 2px 9px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.chip}}</span>
              <span style="position: absolute; right: 10px; bottom: 10px; width: 34px; height: 34px; border-radius: 8px; background: {{p.bmBg}}; color: {{p.bmFg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{p.bmFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.bookmark}}"></path></svg></span>
              <sc-if value="{{p.hover}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 12px 54px; background: linear-gradient(transparent, rgba(31,42,39,.86)); color: #ffffff; font-size: 12px; line-height: 1.6; display: flex; flex-direction: column">
                  <span>캐릭터 · 치이카와, 하치와레, 우사기</span>
                  <span>주소 · 서울 마포구 양화로 (예시)</span>
                  <span>특전 · 2만원 이상 엽서 1장</span>
                </span>
              </sc-if>
            </span>
            <span style="font-family: 'Jua', sans-serif; font-size: 17px; line-height: 1.25; color: #0f6b5c">{{p.title}}</span>
            <span style="font-size: 13px; color: #5f6b68; margin-top: -4px">{{p.place}} · {{p.period}}</span>
          </a>
        </sc-for>
      </div>
      <button style="align-self: center; height: 46px; padding: 0 28px; border-radius: 999px; border: 0; background: #e6fbf7; color: #0b5e57; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">더보기</button>
    </section>

    <aside aria-labelledby="l-ask" style="flex: 1 1 280px; max-width: 320px; display: flex; flex-direction: column; border: 1.5px solid #9eddcc; border-radius: 18px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #e9f7f2">
        <img src="../assets/aniwhere_mascot.png" alt="" style="width: 36px; height: auto; display: block">
        <h2 id="l-ask" style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 19px; color: #0f6b5c">ANI:WHERE에게 물어보기</h2>
      </div>
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 460px">
        <div style="align-self: flex-end; max-width: 82%; background: #14b8a6; color: #ffffff; font-size: 14px; font-weight: 600; padding: 10px 14px; border-radius: 18px 18px 4px 18px">곧 끝나는 서울 팝업 알려줘</div>
        <div style="max-width: 92%; background: #f6f8f7; font-size: 14px; line-height: 1.6; padding: 12px 14px; border-radius: 18px 18px 18px 4px">이번 주 안에 끝나는 서울 팝업이 <strong style="color: #0f6b5c">2건</strong> 있어요.</div>
        <sc-for list="{{answers}}" as="a" hint-placeholder-count="2">
          <a href="A-Detail.dc.html" style="display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px solid #e3e9e7; border-radius: 12px; text-decoration: none; color: #26302d">
            <span style="width: 34px; height: 44px; border-radius: 7px; background: {{a.bg}}; flex: none"></span>
            <span style="display: flex; flex-direction: column"><strong style="font-size: 13.5px">{{a.t}}</strong><span style="font-size: 12px; color: #5f6b68">{{a.s}}</span></span>
          </a>
        </sc-for>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto">
          <button style="font-family: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid #9eddcc; background: #ffffff; color: #0f6b5c; cursor: pointer">팝업 추천해줘</button>
          <button style="font-family: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid #9eddcc; background: #ffffff; color: #0f6b5c; cursor: pointer">내 주변</button>
        </div>
      </div>
      <form style="display: flex; gap: 8px; padding: 12px; border-top: 1px solid #eef2f1">
        <label for="l-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">질문</label>
        <input id="l-q" placeholder="예: 12월 부산 팝업" style="flex: 1; min-width: 0; font-family: inherit; font-size: 14px; padding: 10px 14px; border-radius: 999px; border: 1px solid #e3e9e7; background: #f6f8f7; color: #26302d">
        <button aria-label="보내기" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #14b8a6; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.send}}"></path></svg></button>
      </form>
    </aside>
  </main>

  <button aria-label="팝업 등록하기" style="position: fixed; right: 28px; bottom: 28px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: #ff6b6b; color: #ffffff; box-shadow: 0 4px 14px rgba(0,0,0,.14); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const live = { state: '진행 중', fg: '#0b5e57', sbg: '#e6fbf7' };
    const soon = { state: 'D-3', fg: '#2c5bc5', sbg: '#eaf0fc' };
    const end = { state: '마감임박', fg: '#c0313f', sbg: '#fdecee' };
    const on = { bmBg: '#14b8a6', bmFg: '#ffffff', bmFill: 'currentColor' };
    const off = { bmBg: 'rgba(255,255,255,.75)', bmFg: '#26302d', bmFill: 'none' };
    const base = { line: '#9eddcc', shadow: 'none', hover: false };
    const seoul = '#2e9c82', busan = '#2f6fae';
    return {
      ic: {
        search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M20 20l-4-4',
        bell: 'M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z M10 20a2 2 0 0 0 4 0',
        bookmark: 'M7 4h10v16l-5-3.5L7 20z',
        send: 'M4 12l16-8-6 16-2.5-6.5z'
      },
      cards: [
        Object.assign({}, base, live, on, { title: '치이카와 팝업 스토어', place: '홍대', period: '11.20 ~ 12.15', area: '서울', abg: seoul, chip: '특전 · 엽서', bg: '#ffd6dc', hover: true, line: '#14b8a6', shadow: '0 6px 18px rgba(0,0,0,.12)' }),
        Object.assign({}, base, live, on, { title: '주술회전 콜라보 카페', place: '성수', period: '11.15 ~ 12.08', area: '서울', abg: seoul, chip: '코스터 증정', bg: '#d9e4ff' }),
        Object.assign({}, base, live, off, { title: '하이큐!! 팝업', place: '서면', period: '11.22 ~ 12.22', area: '부산', abg: busan, chip: '포토존', bg: '#ffe6c2' }),
        Object.assign({}, base, end, off, { title: '포켓몬 콜라보 디저트', place: '해운대', period: '~ 11.27', area: '부산', abg: busan, chip: '한정 메뉴', bg: '#fff3b8' }),
        Object.assign({}, base, live, off, { title: '블루 아카이브 전시', place: '성수', period: '~ 12.31', area: '서울', abg: seoul, chip: '아크릴 스탠드', bg: '#efe0ff' }),
        Object.assign({}, base, live, on, { title: '귀멸의 칼날 전시', place: '강남', period: '11.10 ~ 11.30', area: '서울', abg: seoul, chip: '입장 특전', bg: '#d6f2e9' }),
        Object.assign({}, base, soon, off, { title: '원피스 굿즈 팝업', place: '홍대', period: '11.28 ~', area: '서울', abg: seoul, chip: '선착순 키링', bg: '#d9e4ff' }),
        Object.assign({}, base, live, off, { title: '스파이 패밀리 카페', place: '센텀', period: '~ 12.20', area: '부산', abg: busan, chip: '굿즈 · 머그컵', bg: '#ffd6dc' })
      ],
      answers: [
        { t: '귀멸의 칼날 전시', s: '강남 · 11.30 종료', bg: '#d6f2e9' },
        { t: '하이큐!! 굿즈', s: '연남 · 오늘 종료', bg: '#ffe6c2' }
      ]
    };
  }
}
</script>
</body>
</html>
